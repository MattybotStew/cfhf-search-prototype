<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Filter by category · 390px · Happenings Figma screen</title>
  <link rel="stylesheet" href="https://use.typekit.net/acw8nkk.css">
  <link rel="stylesheet" href="figma-screens.css">
</head>
<body>
  <div class="canvas canvas--m">
    <p class="screen-label" style="padding:8px 16px 0">02-listing-filter · 390px · html.to.design</p>
    <div class="shell">
      <div class="topbar"><span>☰</span><img src="http://127.0.0.1:8080/screens/img/logo.png" alt=""><span>Tickets</span></div>
      <div class="main"><div class="listing-hero"><img class="hero-photo" src="http://127.0.0.1:8080/screens/img/hero-listing.jpg" alt="" width="1112" height="416"><div class="hero-shade"></div><div class="hero-copy"><p class="crumb" style="color:#ccc">News &amp; Happenings</p>
      <h1><span class="stroke">Hall</span><br>Happenings</h1>
      <p>Programs, exhibitions, and events at the Hall.</p></div></div>
    <div class="pad" style="padding-top:24px">
      <div class="filter-dropdown is-open"><span class="filter-dropdown__label">Filter</span><div class="filter-dropdown__wrap"><button type="button" class="filter-dropdown__trigger"><span>Ticketed</span><span class="filter-dropdown__chevron" aria-hidden="true"></span></button><ul class="filter-dropdown__menu"><li><button type="button" class="filter-dropdown__option">All</button></li><li><button type="button" class="filter-dropdown__option">Upcoming</button></li><li><button type="button" class="filter-dropdown__option">Free / RSVP</button></li><li><button type="button" class="filter-dropdown__option is-active">Ticketed</button></li><li><button type="button" class="filter-dropdown__option">Exhibitions</button></li><li><button type="button" class="filter-dropdown__option">Community</button></li></ul></div></div>
      <div class="grid"><div class="card"><div class="ph"><img src="http://127.0.0.1:8080/screens/img/hero-listing.jpg" alt="" width="320" height="110"></div><div class="body"><div class="date">Saturdays in Oct</div><div class="title">Gameday Kickoff Party</div><span class="tag">Ticketed</span></div></div><div class="card"><div class="ph"><img src="http://127.0.0.1:8080/screens/img/hero-ticketed.jpg" alt="" width="320" height="110"></div><div class="body"><div class="date">Sep 19</div><div class="title">Legendary Saturday</div><span class="tag">Ticketed</span></div></div></div>
    </div></div>
    </div>
  </div>
</body>
</html>
