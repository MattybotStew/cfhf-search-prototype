<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout · 1440px · Happenings Figma screen</title>
  <link rel="stylesheet" href="https://use.typekit.net/acw8nkk.css">
  <link rel="stylesheet" href="figma-screens.css">
</head>
<body>
  <div class="canvas canvas--d">
    <p class="screen-label" style="padding:8px 16px 0">04-checkout · 1440px · html.to.design</p>
    <div class="shell">
      <aside class="rail">
      <img src="img/logo.png" alt="College Football Hall of Fame">
      <div class="tix">Tickets</div>
      <div class="row"><span>Donate</span><span>Membership</span></div>
      <nav>Hall of Fame<br>Experience<br>Visit<br><strong>News &amp; Happenings</strong><br>Venue Rental<br>CityPASS®</nav>
    </aside><div class="hours"><span>Open Today · 10AM–5PM</span><span>Search</span></div>
      <div class="main"><div class="pad">
      <p class="crumb">Gameday Kickoff Party</p>
      <h1>Choose date and quantity</h1>
      <div class="panel" style="max-width:420px">
        <label>Date</label>
        <div class="field">Sat, Oct 10</div>
        <label>Quantity</label>
        <div class="field">2</div>
        <label>Member price</label>
        <div class="field">On · $8 each</div>
        <div class="price">Total $16</div>
        <span class="btn">Complete purchase</span>
      </div>
    </div></div>
    </div>
  </div>
</body>
</html>
