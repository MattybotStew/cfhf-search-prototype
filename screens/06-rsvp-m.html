<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Save My Spot · 390px · Happenings Figma screen</title>
  <link rel="stylesheet" href="https://use.typekit.net/acw8nkk.css">
  <link rel="stylesheet" href="figma-screens.css">
</head>
<body>
  <div class="canvas canvas--m">
    <p class="screen-label" style="padding:8px 16px 0">06-rsvp · 390px · html.to.design</p>
    <div class="shell">
      <div class="topbar"><span>☰</span><img src="../assets/images/logo.png" alt=""><span>Tickets</span></div>
      <div class="main"><div class="hero">
      <p class="crumb" style="color:#ccc">Happenings / Community Film Night</p>
      <h1>Community<br>Film Night</h1>
      <p>Friday, September 11 · 6–9PM</p>
      <span class="tag tag--out">Free · RSVP</span>
      <p style="margin-top:16px"><span class="btn">Save My Spot</span></p>
    </div>
    <div class="split">
      <div class="panel">
        <h2>Reserve your seat</h2>
        <label>Full name</label>
        <div class="field"></div>
        <label>Email</label>
        <div class="field"></div>
        <label># Attending</label>
        <div class="field">2</div>
        <p style="margin-top:16px"><span class="btn">Save My Spot</span></p>
      </div>
      <div>
        <h2>About the program</h2>
        <p>Free community screening in the Hall theater, then a short panel talk.</p>
      </div>
    </div></div>
    </div>
  </div>
</body>
</html>
