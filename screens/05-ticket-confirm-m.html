<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Purchase confirmation · 390px · Happenings Figma screen</title>
  <link rel="stylesheet" href="https://use.typekit.net/acw8nkk.css">
  <link rel="stylesheet" href="figma-screens.css">
</head>
<body>
  <div class="canvas canvas--m">
    <p class="screen-label" style="padding:8px 16px 0">05-ticket-confirm · 390px · html.to.design</p>
    <div class="shell">
      <div class="topbar"><span>☰</span><img src="http://127.0.0.1:8080/screens/img/logo.png" alt=""><span>Tickets</span></div>
      <div class="main"><div class="confirm">
      <p class="crumb">Confirmation</p>
      <h1>You are going</h1>
      <p><strong>2</strong> tickets for <strong>Gameday Kickoff Party</strong> on <strong>Sat, Oct 10</strong> — <strong>$16</strong>.</p>
      <p style="margin-top:16px"><span class="btn">Browse more events</span> <span class="btn btn--out">Add to calendar</span></p>
    </div>
    <div class="pad"><h2>More upcoming events</h2></div>
    <div class="related">
      <div class="card"><div class="ph"><img src="http://127.0.0.1:8080/screens/img/hero-listing.jpg" alt="" width="320" height="110"></div><div class="body"><div class="title">Football Fest</div></div></div>
      <div class="card"><div class="ph"><img src="http://127.0.0.1:8080/screens/img/hero-exhibit.jpg" alt="" width="320" height="110"></div><div class="body"><div class="title">Film Night</div></div></div>
      <div class="card"><div class="ph"><img src="http://127.0.0.1:8080/screens/img/hero-ticketed.jpg" alt="" width="320" height="110"></div><div class="body"><div class="title">Legendary Saturday</div></div></div>
    </div></div>
    </div>
  </div>
</body>
</html>
